defaults:
  - gs: base
  - _self_ 

seed: 228

wandb:
  mode: "online" # "disabled" for no logging
  entity: "3dcorrespondence"
  project: "Adv3DGS"
  group: null
  name: null
  tag: "debug"
    
train:
  gs_epochs: 0 # number of 3dgs iterations
  reduce_opacity: True 
  no_densify: False # if True, the model will not be densified
  max_lr: True 

load:
  gs: null #path to 3dgs checkpoint
  gs_step: null #number of iterations, e.g. 7000

device: "cuda:0"
verbose: true

init_wC:
  use: True # use EDGS
  # Correspondence initializer.  `roma` preserves the original EDGS path;
  # `mvroma` performs direct, in-process multi-view matching without a cache.
  backend: "roma" # "roma" or "mvroma"
  matches_per_ref: 15_000 # number of matches per reference
  num_refs: 180 # RoMa references; MV-RoMa auto group-budget lower bound
  nns_per_ref: 3 # RoMa-only camera-matrix neighbors per reference
  scaling_factor: 0.001
  proj_err_tolerance: 0.01
  roma_model: "outdoors" # you can change this to "indoors" or "outdoors"
  add_SfM_init : False

  mvroma:
    # These two paths are supplied by the launcher when backend=mvroma.  Null
    # defaults keep the original RoMa setup self-contained and import-free.
    root: null
    checkpoint: null

    # Saved with config.yaml so a reconstruction cannot silently reuse a
    # different MV-RoMa source tree or checkpoint.
    checkpoint_sha256: null
    source_revision: null

    # UFM's UniCeption encoder is resolved from this vendored DINOv2 checkout
    # and explicit local checkpoint.  Runtime network fallback is forbidden.
    dinov2_root: null
    dinov2_checkpoint: null
    dinov2_checkpoint_sha256: null
    dinov2_source_revision: null

    prematcher: "ufm"
    coarse_resolution: [560, 560] # [height, width], divisible by ViT patch size 14
    target_resolution: [560, 840] # [height, width]
    num_clusters: 512
    upsample_preds: True
    seed: 0 # deterministic confidence-weighted dense-track sampling

    # Geometry/quality defaults.  Dense MV-RoMa predictions stay in memory;
    # only the points accepted by EDGS are triangulated into Gaussian seeds.
    image_root: null
    apply_square: False
    prematch_batched: False
    covisibility_threshold: 0.3
    confidence_threshold: 0.5
    min_target_views: 2
    min_triangulation_angle_deg: 0.5
    strict_checkpoint: False

    # MV-RoMa paper-style overlap-aware camera grouping.  COLMAP point tracks
    # provide directed visibility overlap, so camera-matrix kNN is not used.
    group_planner:
      overlap_provider: "colmap"
      sparse_model_path: null # inferred as <image_root>/../sparse/0
      targets_per_group: 4
      # null -> max(init_wC.num_refs, number of train cameras). Every camera
      # remains a source at least once, as required by the paper planner.
      primary_group_budget: null
      overlap_threshold: 0.05
      source_quota_exponent: 0.75
      source_overlap_weight: 1.0
      target_overlap_weight: 1.0
      pair_reuse_penalty: 1.0
      augment_reciprocity: True
